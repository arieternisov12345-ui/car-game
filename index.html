<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпион — Оюн</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121624;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .card {
            background-color: #1a2238;
            width: 380px;
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: #a855f7;
            margin: 0 0 8px 0;
            font-size: 28px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #111827;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .add-btn {
            background-color: #6366f1;
            border: none;
            border-radius: 12px;
            width: 48px;
            height: 48px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .select-container {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
            display: block;
        }

        select {
            width: 100%;
            background-color: #111827;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 14px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .start-btn {
            width: 100%;
            background-color: #6366f1;
            border: none;
            border-radius: 14px;
            padding: 14px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .start-btn:hover, .add-btn:hover {
            opacity: 0.9;
        }

        /* Тизме стили */
        .players-list {
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: left;
            font-size: 13px;
            color: #cbd5e1;
            background: #111827;
            padding: 8px 12px;
            border-radius: 10px;
        }

        /* Оюн экраны */
        #gameScreen {
            display: none;
        }

        .timer {
            font-size: 48px;
            font-weight: bold;
            color: #f43f5e;
            margin: 20px 0;
        }

        .result-box {
            font-size: 18px;
            color: #38bdf8;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Жөндөө экраны -->
        <div id="setupScreen">
            <h1>Шпион</h1>
            <div class="subtitle">Оюн үчүн компания</div>

            <label>Оюнчу кошуу</label>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Оюнчунун аты...">
                <button class="add-btn" onclick="addPlayer()">+</button>
            </div>

            <div class="players-list" id="playersList">Кошулган оюнчулар жок</div>

            <div class="select-container">
                <label>Шпиондордун саны</label>
                <select id="spyCount">
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <div class="select-container">
                <label>Оюн убактысы (секунд)</label>
                <select id="gameTime">
                    <option value="30">30 секунд</option>
                    <option value="60">1 мүнөт (60 сек)</option>
                    <option value="120">2 мүнөт (120 сек)</option>
                </select>
            </div>

            <button class="start-btn" onclick="startGame()">Оюнду баштоо</button>
        </div>

        <!-- Оюн жүрүп жаткан экран (Таймер) -->
        <div id="gameScreen">
            <h1>Оюн жүрүүдө...</h1>
            <div class="subtitle">Талкуу жүрүп жатат, шпионду табыңыз!</div>
            
            <div class="timer" id="timerDisplay">00:00</div>
            
            <div class="result-box" id="resultBox"></div>

            <button class="start-btn" id="restartBtn" style="display:none;" onclick="resetGame()">Жаңы оюн</button>
        </div>
    </div>

    <script>
        let players = [];
        let spies = [];
        let timerInterval;

        function addPlayer() {
            const input = document.getElementById('playerName');
            const name = input.value.trim();
            if (name !== "" && !players.includes(name)) {
                players.push(name);
                updatePlayersList();
                input.value = "";
            }
        }

        function updatePlayersList() {
            const listDiv = document.getElementById('playersList');
            if (players.length === 0) {
                listDiv.innerHTML = "Кошулган оюнчулар жок";
            } else {
                listDiv.innerHTML = players.join(', ');
            }
        }

        function startGame() {
            if (players.length < 3) {
                alert("Оюн үчүн кеминде 3 оюнчу керек!");
                return;
            }

            // Экранды алмаштыруу
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';

            // Шпиондорду кокустан тандоо
            let spyNumber = parseInt(document.getElementById('spyCount').value);
            if (spyNumber >= players.length) spyNumber = 1;
            
            spies = [];
            let playersCopy = [...players];
            for (let i = 0; i < spyNumber; i++) {
                let randomIndex = Math.floor(Math.random() * playersCopy.length);
                spies.push(playersCopy.splice(randomIndex, 1)[0]);
            }

            // Таймерди баштоо
            let timeLeft = parseInt(document.getElementById('gameTime').value);
            updateTimerDisplay(timeLeft);

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = seconds % 60;
            document.getElementById('timerDisplay').innerText = 
                (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        function endGame() {
            document.getElementById('timerDisplay').innerText = "Убакыт бүттү!";
            const resultBox = document.getElementById('resultBox');
            
            // Убакыт бүткөндө шпиондорду көрсөтүү
            resultBox.innerHTML = `Шпион(дор) болгон: <span style="color: #f43f5e;">${spies.join(', ')}</span>`;
            document.getElementById('restartBtn').style.display = 'block';
        }

        function resetGame() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'block';
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('resultBox').innerHTML = "";
            players = [];
            updatePlayersList();
        }
    </script>

</body>
</html>
